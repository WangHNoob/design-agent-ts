global:
  resolve_timeout: 5m

# Alert routing configuration
# Customize with your company's notification channels:
# - Webhook (DingTalk/Feishu/Slack)
# - Email
# - SMS
route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "webhook"

receivers:
  - name: "webhook"
    webhook_configs:
      # DingTalk/Feishu webhook URL — set via ALERT_WEBHOOK_URL env var
      - url: "http://localhost:5001/alerts"
        send_resolved: true

  # Uncomment to enable email alerts
  # - name: "email"
  #   email_configs:
  #     - to: "ops@your-company.com"
  #       from: "alertmanager@your-company.com"
  #       smarthost: "smtp.example.com:587"
  #       auth_username: "alertmanager@your-company.com"
  #       auth_password: "${SMTP_PASSWORD}"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
