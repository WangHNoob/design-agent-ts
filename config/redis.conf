# Redis persistence configuration
# AOF (Append Only File) + RDB (snapshot) dual persistence
# AOF: fsync every second — up to 1 second of data loss
# RDB: snapshot every 15 minutes if at least 1 key changed

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots
save 900 1
save 300 10
save 60 10000

# RDB file name
dbfilename dump.rdb

# Both AOF and RDB are enabled
# On restart, Redis will use AOF to reconstruct data (more complete)
aof-use-rdb-preamble yes
