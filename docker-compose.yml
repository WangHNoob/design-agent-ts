services:
  # ─── Infrastructure ────────────────────────────────────────────
  postgres:
    # Keep PG 16 to match README/migrate client; pg18 changes the data dir layout
    # and rejects existing /var/lib/postgresql/data volumes without pg_upgrade.
    image: pgvector/pgvector:pg16
    container_name: gdt-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game_designer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_designer}
      POSTGRES_DB: ${POSTGRES_DB:-game_designer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pg_backups:/backups
    restart: unless-stopped
    healthcheck:
      # Must authenticate as POSTGRES_USER — pg_isready alone stays healthy even when
      # an old volume only has the default "postgres" role and migrate cannot connect.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # PostgreSQL backup cron (runs daily at 2:00 AM)
  pg-backup:
    profiles: ["infra"]
    image: postgres:16-alpine
    container_name: gdt-pg-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-game_designer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_designer}
      POSTGRES_DB: ${POSTGRES_DB:-game_designer}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
    volumes:
      - pg_backups:/backups
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 2 * * * /usr/local/bin/pg-backup.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gdt-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdt-backend
    ports:
      - "${BACKEND_PORT:-13000}:3000"
    environment:
      - PORT=3000
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      # Framework
      - AGENT_FRAMEWORK=${AGENT_FRAMEWORK:-langgraph}
      # HITL
      - HITL_ENABLED=${HITL_ENABLED:-false}
      # Knowledge
      - KNOWLEDGE_WIKI_PATH=./knowledge/wiki
      - KNOWLEDGE_GRAPH_PATH=./knowledge/processed
      # Web Search
      - TAVILY_ENABLED=${TAVILY_ENABLED:-false}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Long-Term Memory
      - LTM_ENABLED=${LTM_ENABLED:-true}
      # User System (Better Auth)
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      - BETTER_AUTH_BASE_URL=http://backend:3000
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-game_designer}:${POSTGRES_PASSWORD:-game_designer}@postgres:5432/${POSTGRES_DB:-game_designer}
      - REDIS_URL=redis://redis:6379/0
      - MAX_CONCURRENT_PER_USER=${MAX_CONCURRENT_PER_USER:-3}
      # Admin domains (comma-separated email domains for auto admin role)
      - ADMIN_EMAIL_DOMAINS=${ADMIN_EMAIL_DOMAINS:-}
      # DingTalk SSO
      - DINGTALK_CLIENT_ID=${DINGTALK_CLIENT_ID:-}
      - DINGTALK_CLIENT_SECRET=${DINGTALK_CLIENT_SECRET:-}
      - ALLOW_EMAIL_PASSWORD=${ALLOW_EMAIL_PASSWORD:-true}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-http://localhost:3001}
      # Message Queue
      - MQ_ENABLED=true
      - MQ_CONSUMER_GROUP=${MQ_CONSUMER_GROUP:-gd-workers}
    volumes:
      - ./contrib:/app/contrib
      - ./prompts:/app/prompts
      - ./knowledge:/app/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    container_name: gdt-migrate
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-game_designer}
    volumes:
      - ./drizzle:/migrations:ro
      - ./scripts/apply-drizzle-migrations.sh:/apply-drizzle-migrations.sh:ro
    entrypoint: ["/bin/sh", "/apply-drizzle-migrations.sh"]
    command:
      - ${POSTGRES_USER:-game_designer}
      - postgres
      - ${POSTGRES_DB:-game_designer}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gdt-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      # Internal URL for Next.js API proxy → backend
      - API_BASE_URL=http://backend:3000
      # Browser-side API base URL (host port)
      - NEXT_PUBLIC_API_BASE=http://localhost:13000
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Monitoring ────────────────────────────────────────────────
  prometheus:
    profiles: ["infra"]
    image: prom/prometheus:latest
    container_name: gdt-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  alertmanager:
    profiles: ["infra"]
    image: prom/alertmanager:latest
    container_name: gdt-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  grafana:
    profiles: ["infra"]
    image: grafana/grafana:latest
    container_name: gdt-grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  pg_backups:
  redis_data:
  prometheus_data:
  grafana_data:
