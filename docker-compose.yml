version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gdt-backend
    ports:
      - "13000:3000"
    environment:
      - PORT=3000
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - AGENT_FRAMEWORK=${AGENT_FRAMEWORK:-langgraph}
      - HITL_ENABLED=${HITL_ENABLED:-false}
      - KNOWLEDGE_WIKI_PATH=./knowledge/wiki
      - KNOWLEDGE_GRAPH_PATH=./knowledge/processed
      - TAVILY_ENABLED=${TAVILY_ENABLED:-false}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - ./sessions:/app/sessions
      - ./settings.json:/app/settings.json
      - ./contrib:/app/contrib
      - ./prompts:/app/prompts
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:13000
    container_name: gdt-frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped
