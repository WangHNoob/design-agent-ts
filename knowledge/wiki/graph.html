<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Wiki 知识图谱</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  html, body { margin:0; height:100%; font-family: -apple-system, "Segoe UI", sans-serif; background:#1a1a2e; color:#eee; }
  #graph { width:100vw; height:100vh; }
  #panel {
    position:fixed; top:14px; left:14px;
    background:rgba(20,20,40,0.9); backdrop-filter: blur(8px);
    padding:14px 16px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    max-width:320px; z-index:10;
    font-size:13px; line-height:1.5;
  }
  #panel h3 { margin:0 0 8px; font-size:14px; color:#fff; }
  #panel .legend { margin:8px 0; }
  #panel .legend span {
    display:inline-block; padding:2px 8px; margin:2px 4px 2px 0;
    border-radius:10px; font-size:11px; color:#111;
  }
  #panel .stats { color:#aaa; font-size:12px; margin-top:6px; }
  #panel label { display:block; margin:4px 0; cursor:pointer; }
  #panel input[type=text] { width:100%; padding:4px 6px; border-radius:4px;
                            border:1px solid #444; background:#222; color:#eee; }
  #detail {
    position:fixed; right:14px; top:14px; width:300px;
    background:rgba(20,20,40,0.9); backdrop-filter: blur(8px);
    padding:14px 16px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    z-index:10; font-size:13px; display:none;
    max-height: 80vh; overflow-y: auto;
  }
  #detail a { color:#4fc3f7; text-decoration: none; }
  #detail a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="panel">
  <h3>Wiki 知识图谱</h3>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <label><input type="checkbox" id="f_doc"      checked> 文档 (doc)</label>
  <label><input type="checkbox" id="f_system"   checked> 系统 (system)</label>
  <label><input type="checkbox" id="f_activity" checked> 活动 (activity)</label>
  <label><input type="checkbox" id="f_concept"  checked> 概念 (concept)</label>
  <label><input type="checkbox" id="f_resource" checked> 资源 (resource)</label>
  <label><input type="checkbox" id="f_attribute" checked> 属性 (attribute)</label>
  <label><input type="checkbox" id="f_table"    checked> 配置表 (table)</label>
  <label><input type="checkbox" id="f_fk"       checked> 显示 FK 虚线边</label>
  <input type="text" id="search" placeholder="搜索节点..." />
</div>
<div id="detail"></div>
<div id="graph"></div>

: true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "ultimateChallenge/UltimateChapter", "to": "fight/Skill", "label": "skillId", "title": "FK: ultimateChallenge/UltimateChapter.skillId → fight/Skill", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "ultimateChallenge/UltimateEntry", "to": "fight/FightBuff", "label": "fightBuffId", "title": "FK: ultimateChallenge/UltimateEntry.fightBuffId → fight/FightBuff", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "union/UnionBuildBatteryExp", "to": "Item", "label": "itemId", "title": "FK: union/UnionBuildBatteryExp.itemId → Item", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "union/UnionBuildingLev", "to": "Plot", "label": "plotId", "title": "FK: union/UnionBuildingLev.plotId → Plot", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "union/UnionTradeShipBuff", "to": "fight/_Buff", "label": "buffId", "title": "FK: union/UnionTradeShipBuff.buffId → fight/_Buff", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "union/UnionTrainRoomSkill", "to": "fight/Skill", "label": "skillId", "title": "FK: union/UnionTrainRoomSkill.skillId → fight/Skill", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "unionSeaFight/USFAIShip", "to": "ship/Ship", "label": "shipId", "title": "FK: unionSeaFight/USFAIShip.shipId → ship/Ship", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "unionSeaFight/USFBuff", "to": "fight/_Buff", "label": "buffId", "title": "FK: unionSeaFight/USFBuff.buffId → fight/_Buff", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "unionSeaFight/USFSkill", "to": "fight/Skill", "label": "skillId", "title": "FK: unionSeaFight/USFSkill.skillId → fight/Skill", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "unionSkillTree/UnionSkillTreeOneSkillLevel", "to": "fight/Skill", "label": "skillId", "title": "FK: unionSkillTree/UnionSkillTreeOneSkillLevel.skillId → fight/Skill", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "warChess/WarChessEnemy", "to": "Hero", "label": "heroId", "title": "FK: warChess/WarChessEnemy.heroId → Hero", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "warChess/WarChessHero", "to": "Hero", "label": "heroId", "title": "FK: warChess/WarChessHero.heroId → Hero", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "warChess/WarChessHeroStar", "to": "Hero", "label": "heroId", "title": "FK: warChess/WarChessHeroStar.heroId → Hero", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "warChess/WarChessSkill", "to": "fight/Skill", "label": "skillId", "title": "FK: warChess/WarChessSkill.skillId → fight/Skill", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "warChess/_WarChessEvent", "to": "fight/_Buff", "label": "buffId", "title": "FK: warChess/_WarChessEvent.buffId → fight/_Buff", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "worldBoss/NewWPBoss", "to": "Hero", "label": "heroId", "title": "FK: worldBoss/NewWPBoss.heroId → Hero", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "worldBoss/WorldPersonBoss", "to": "Hero", "label": "heroId", "title": "FK: worldBoss/WorldPersonBoss.heroId → Hero", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "worldBoss/WorldPersonBoss", "to": "Item", "label": "itemId", "title": "FK: worldBoss/WorldPersonBoss.itemId → Item", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}, {"from": "yearactivity/_YearActivityBuff", "to": "fight/_Buff", "label": "buffId", "title": "FK: yearactivity/_YearActivityBuff.buffId → fight/_Buff", "arrows": "to", "dashes": true, "color": {"color": "#6aa9c2"}, "edge_kind": "fk"}];
const TYPE_COLORS = {"doc": "#ff8a5b", "system": "#4fc3f7", "activity": "#ba68c8", "concept": "#aed581", "resource": "#ffd54f", "attribute": "#f06292", "table": "#90a4ae"};

const legendEl = document.getElementById('legend');
Object.entries(TYPE_COLORS).forEach(([t, c]) => {
  const s = document.createElement('span');
  s.style.background = c;
  s.textContent = t;
  legendEl.appendChild(s);
});
document.getElementById('stats').innerHTML =
  `节点: ${RAW_NODES.length} · 边: ${RAW_EDGES.length}`;

const nodesDS = new vis.DataSet(RAW_NODES);
const edgesDS = new vis.DataSet(RAW_EDGES);

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    solver: "forceAtlas2Based",
    forceAtlas2Based: { gravitationalConstant: -50, springLength: 90, avoidOverlap: 0.3 },
    stabilization: { iterations: 300, onlyDynamicEdges: false, fit: true },
  },
  interaction: { hover: true, tooltipDelay: 150 },
  nodes: { shape: "dot", size: 14, font: { color: "#fff", size: 13 } },
  edges: { font: { color: "#aaa", size: 10, strokeWidth: 0 }, smooth: { type: "continuous" } }
});

function applyFilters() {
  const active = {
    doc:       document.getElementById('f_doc').checked,
    system:    document.getElementById('f_system').checked,
    activity:  document.getElementById('f_activity').checked,
    concept:   document.getElementById('f_concept').checked,
    resource:  document.getElementById('f_resource').checked,
    attribute: document.getElementById('f_attribute').checked,
    table:     document.getElementById('f_table').checked,
  };
  const fkOn = document.getElementById('f_fk').checked;
  const q = document.getElementById('search').value.trim().toLowerCase();

  const visibleNodeIds = new Set();
  RAW_NODES.forEach(n => {
    if (!active[n.group]) return;
    if (q && !n.id.toLowerCase().includes(q)) return;
    visibleNodeIds.add(n.id);
  });

  nodesDS.update(RAW_NODES.map(n => ({
    id: n.id, hidden: !visibleNodeIds.has(n.id)
  })));
  edgesDS.update(RAW_EDGES.map((e, i) => ({
    id: i,
    hidden: !(visibleNodeIds.has(e.from) && visibleNodeIds.has(e.to)
              && (fkOn || e.edge_kind !== 'fk'))
  })));
}
// 为边补 id（vis-network 需要）
RAW_EDGES.forEach((e, i) => e.id = i);
edgesDS.clear();
edgesDS.add(RAW_EDGES);

['f_doc','f_system','f_activity','f_concept','f_resource','f_attribute','f_table','f_fk']
  .forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
document.getElementById('search').addEventListener('input', applyFilters);

// 稳定化完成后关闭物理引擎，节点不再漂移
network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: false });
});

// 节点点击：展示详情 + 邻居
const detailEl = document.getElementById('detail');
network.on('click', params => {
  if (!params.nodes.length) { detailEl.style.display = 'none'; return; }
  const id = params.nodes[0];
  const n = RAW_NODES.find(x => x.id === id);
  if (!n) return;
  const neighbors = RAW_EDGES.filter(e => e.from === id || e.to === id);
  const outgoing = neighbors.filter(e => e.from === id)
    .map(e => `<li>→ ${e.to} <span style="color:#888">(${e.label || e.edge_kind})</span></li>`).join('');
  const incoming = neighbors.filter(e => e.to === id)
    .map(e => `<li>← ${e.from} <span style="color:#888">(${e.label || e.edge_kind})</span></li>`).join('');
  const pageLink = n.wiki_page
    ? `<p><a href="${n.wiki_page}" target="_blank">打开 wiki 页面</a></p>` : '';
  detailEl.innerHTML = `
    <h3 style="margin:0 0 6px">${n.id}</h3>
    <p style="color:#aaa;margin:0">type: ${n.group}</p>
    ${pageLink}
    <p><b>出边 (${outgoing ? neighbors.filter(e=>e.from===id).length : 0}):</b></p>
    <ul style="margin:4px 0 8px;padding-left:18px">${outgoing || '<li style="color:#666">无</li>'}</ul>
    <p><b>入边 (${incoming ? neighbors.filter(e=>e.to===id).length : 0}):</b></p>
    <ul style="margin:4px 0;padding-left:18px">${incoming || '<li style="color:#666">无</li>'}</ul>
  `;
  detailEl.style.display = 'block';
});
</script>
</body>
